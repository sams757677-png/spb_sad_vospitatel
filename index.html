<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МБДОУ — Старший воспитатель</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ================= ЗАЩИТА ОТ КОПИРОВАНИЯ ================= */
    html, body {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
    }
    input, textarea, select, [contenteditable="true"] {
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
    }
    img, svg, .emoji, .banner-emoji, .logo-icon {
        -webkit-user-drag: none;
        user-drag: none;
    }
    body ::selection { background: transparent; }
    input::selection, textarea::selection { background: #b3d4fc; color: inherit; }

    body {
        font-family: 'Segoe UI', 'Comic Sans MS', Tahoma, sans-serif;
        background: linear-gradient(135deg, #fef9e7 0%, #e8f4f8 50%, #f0e6f6 100%);
        min-height: 100vh;
        color: #2c3e50;
    }

    header {
        background: linear-gradient(135deg, #4a90e2 0%, #7b68ee 100%);
        padding: 30px 40px;
        box-shadow: 0 4px 20px rgba(74, 144, 226, 0.3);
        position: relative; overflow: hidden;
    }
    header::before {
        content: "🌈"; position: absolute; font-size: 180px; opacity: 0.08;
        top: -50px; right: 50px; transform: rotate(-15deg);
    }
    header::after {
        content: "🎨"; position: absolute; font-size: 140px; opacity: 0.08;
        bottom: -40px; left: 30px;
    }
    .header-content {
        max-width: 1400px; margin: 0 auto;
        display: flex; justify-content: space-between; align-items: center;
        position: relative; z-index: 2; flex-wrap: wrap; gap: 20px;
    }
    .logo-block { display: flex; align-items: center; gap: 20px; }
    .logo-icon {
        width: 70px; height: 70px; background: rgba(255,255,255,0.25);
        border-radius: 20px; display: flex; align-items: center; justify-content: center;
        font-size: 38px; backdrop-filter: blur(10px);
        border: 2px solid rgba(255,255,255,0.4);
        cursor: pointer; transition: transform .2s; flex: none;
    }
    .logo-icon:hover { transform: scale(1.05); }
    .title-block h1 { color: #fff; font-size: 28px; font-weight: 700; letter-spacing: 0.5px; }
    .title-block p { color: rgba(255,255,255,0.9); font-size: 15px; margin-top: 4px; }
    .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    .user-info {
        display: flex; align-items: center; gap: 12px;
        background: rgba(255,255,255,0.2); padding: 10px 20px;
        border-radius: 50px; backdrop-filter: blur(10px);
        border: 2px solid rgba(255,255,255,0.3);
        cursor: pointer; color: #fff;
        transition: background .2s, transform .2s;
        font-family: inherit;
    }
    .user-info:hover { background: rgba(255,255,255,0.32); transform: translateY(-2px); }
    .user-avatar {
        width: 45px; height: 45px;
        background: linear-gradient(135deg, #ffd93d, #ff9a3c);
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        font-size: 22px; flex: none;
    }
    .user-info span { font-weight: 600; font-size: 15px; }
    .user-info .lock { margin-left: 4px; font-size: 16px; opacity: 0.9; }

    .logout-header-btn {
        display: none; align-items: center; gap: 8px;
        font-family: inherit; font-size: 14px; font-weight: 700; color: #fff;
        background: rgba(220, 38, 38, 0.85);
        border: 2px solid rgba(255,255,255,0.35);
        border-radius: 50px; padding: 11px 20px; cursor: pointer;
        backdrop-filter: blur(10px);
        transition: background .2s, transform .2s;
    }
    .logout-header-btn:hover { background: rgba(220, 38, 38, 1); transform: translateY(-2px); }
    .logout-header-btn.visible { display: inline-flex; }

    main { max-width: 1400px; margin: 0 auto; padding: 50px 40px 80px; }
    .section-title { text-align: center; margin-bottom: 15px; }
    .section-title h2 { font-size: 36px; color: #2c3e50; font-weight: 800; margin-bottom: 10px; }
    .section-title p { color: #7f8c8d; font-size: 17px; }

    .groups-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 22px; margin-top: 50px;
    }
    .group-card {
        position: relative; aspect-ratio: 1/1;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 4px; padding: 20px; text-align: center; cursor: pointer; color: #fff;
        border: none; border-radius: 30px;
        background: linear-gradient(145deg, var(--c1), var(--c2));
        box-shadow: 0 14px 28px -16px rgba(15,23,42,.65);
        overflow: hidden;
        transition: transform .28s cubic-bezier(.2,.8,.3,1), box-shadow .28s;
        text-shadow: 0 2px 8px rgba(0,0,0,.22);
        font-family: inherit; min-width: 0; min-height: 0;
    }
    .group-card::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,.28), transparent 46%);
        pointer-events: none;
    }
    .group-card:hover, .group-card:focus-visible {
        transform: translateY(-9px) scale(1.02);
        box-shadow: 0 30px 46px -22px rgba(15,23,42,.75); outline: none;
    }
    .group-card:active { transform: translateY(-4px) scale(1.01); }
    .card-top, .card-bottom { display: contents; }
    .group-card .emoji {
        font-size: 58px; line-height: 1;
        filter: drop-shadow(0 5px 10px rgba(0,0,0,.25));
        max-width: 100%; display: block;
    }
    .group-card h3 {
        font-size: 24px; font-weight: 800; letter-spacing: -.015em;
        line-height: 1.15; margin-top: 10px; margin-bottom: 0;
        padding: 0 6px; width: 100%; max-width: 100%;
        overflow-wrap: anywhere; word-break: break-word; hyphens: auto;
    }
    .group-card .age {
        font-size: 12.5px; font-weight: 700; letter-spacing: .1em;
        text-transform: uppercase; opacity: .92; margin-top: 4px;
        padding: 0 6px; width: 100%; max-width: 100%;
        overflow-wrap: anywhere; word-break: break-word;
    }
    .card-link {
        display: inline-flex; align-items: center; gap: 6px;
        margin-top: 14px; padding: 6px 14px;
        font-size: 12px; font-weight: 700; letter-spacing: .1em;
        text-transform: uppercase; border-radius: 999px;
        background: rgba(255,255,255,.26); backdrop-filter: blur(6px);
        border: none; transition: background .2s;
        max-width: 100%; white-space: nowrap;
    }
    .group-card:hover .card-link { background: rgba(255,255,255,.42); }

    .c1  { --c1: #ff6b9d; --c2: #ff8e53; }
    .c2  { --c1: #4facfe; --c2: #00f2fe; }
    .c3  { --c1: #43e97b; --c2: #38f9d7; }
    .c4  { --c1: #fa709a; --c2: #fee140; }
    .c5  { --c1: #a18cd1; --c2: #fbc2eb; }
    .c6  { --c1: #f093fb; --c2: #f5576c; }
    .c7  { --c1: #43cea2; --c2: #185a9d; }
    .c8  { --c1: #ff512f; --c2: #f09819; }
    .c9  { --c1: #2193b0; --c2: #6dd5ed; }
    .c10 { --c1: #7f7fd5; --c2: #86a8e7; }
    .c11 { --c1: #11998e; --c2: #38ef7d; }
    .c12 { --c1: #ff9966; --c2: #ff5e62; }
    .c13 { --c1: #00b4db; --c2: #0083b0; }
    .c14 { --c1: #134e5e; --c2: #71b280; }
    .c15 { --c1: #ec008c; --c2: #fc6767; }
    .c16 { --c1: #4568dc; --c2: #b06ab3; }

    footer { text-align: center; padding: 30px; color: #95a5a6; font-size: 14px; }

    .modal {
        position: fixed; inset: 0; background: rgba(44,62,80,0.7);
        backdrop-filter: blur(6px); display: none;
        align-items: center; justify-content: center;
        z-index: 100; padding: 20px;
    }
    .modal.active { display: flex; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-content {
        background: #fff; border-radius: 25px; padding: 40px;
        max-width: 500px; width: 100%; text-align: center;
        animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes slideUp {
        from { transform: translateY(30px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }
    .modal-content h3 { font-size: 26px; margin-bottom: 15px; color: #2c3e50; }
    .modal-content p { color: #7f8c8d; margin-bottom: 25px; font-size: 16px; line-height: 1.6; }
    .modal-close {
        background: linear-gradient(135deg, #4a90e2, #7b68ee); color: #fff;
        border: none; padding: 14px 40px; border-radius: 30px;
        font-size: 16px; font-weight: 700; cursor: pointer;
        transition: transform 0.2s; font-family: inherit;
    }
    .modal-close:hover { transform: scale(1.05); }

    .group-page { max-width: 1400px; margin: 0 auto; padding: 30px 40px 80px; }

    .back-btn {
        display: inline-flex; align-items: center; gap: 8px;
        font-family: inherit; font-size: 15px; font-weight: 700;
        color: #2c3e50; background: #fff; border: none;
        border-radius: 16px; padding: 12px 20px; margin-bottom: 20px;
        cursor: pointer; box-shadow: 0 10px 22px -16px rgba(15,23,42,.9);
        transition: transform .2s;
    }
    .back-btn:hover { transform: translateX(-4px); }

    .group-banner {
        display: flex; align-items: center; gap: 20px;
        padding: 26px 30px; border-radius: 28px; color: #fff;
        background: linear-gradient(135deg, var(--c1), var(--c2));
        box-shadow: 0 20px 40px -22px rgba(15,23,42,.7);
        margin-bottom: 24px; text-shadow: 0 2px 8px rgba(0,0,0,.2);
        position: relative; overflow: hidden;
    }
    .group-banner::after {
        content: ""; position: absolute; right: -50px; top: -60px;
        width: 200px; height: 200px; border-radius: 50%;
        background: rgba(255,255,255,.16);
    }
    .group-banner .banner-emoji {
        font-size: 54px; line-height: 1; position: relative; z-index: 1;
        filter: drop-shadow(0 5px 10px rgba(0,0,0,.25));
    }
    .group-banner .banner-text { position: relative; z-index: 1; }
    .group-banner h1 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
    .group-banner p { font-size: 15px; font-weight: 600; opacity: .92; margin-top: 4px; }

    /* ================= ТАБЫ ================= */
    .tabs {
        display: flex; gap: 6px;
        padding: 6px;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 12px 26px -20px rgba(15,23,42,.9);
        margin-bottom: 14px;
        overflow-x: auto;
        overflow-y: hidden;
        white-space: nowrap;
        scrollbar-width: none;
        -ms-overflow-style: none;
        -webkit-overflow-scrolling: touch;
        max-width: 100%;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        touch-action: pan-y;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs.dragging { cursor: grabbing; }

    .tab {
        flex: 0 0 auto;
        font-family: inherit; font-size: 15px; font-weight: 700;
        color: #7f8c8d; background: transparent; border: none;
        border-radius: 13px; padding: 11px 22px; cursor: pointer;
        transition: color .2s, background .2s;
        user-select: none; -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    .tab:hover { color: #2c3e50; }
    .tab.active {
        color: #fff; background: linear-gradient(135deg, #4a90e2, #7b68ee);
        box-shadow: 0 8px 18px -10px rgba(74,144,226,.9);
    }

    /* ================= ФИЛЬТР ПО МЕСЯЦАМ (под меню-табами) ================= */
    .month-filter-wrap {
        display: flex; align-items: center; gap: 10px;
        margin: 0 0 18px;
    }
    .month-filter-wrap .mf-label {
        flex: none;
        font-size: 11px; font-weight: 800;
        letter-spacing: .1em; text-transform: uppercase;
        color: #7f8c8d; padding-left: 4px;
        display: inline-flex; align-items: center; gap: 6px;
    }
    .month-filter {
        flex: 1; min-width: 0;
        display: flex; gap: 6px;
        padding: 6px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 12px 26px -22px rgba(15,23,42,.9);
        overflow-x: auto;
        overflow-y: hidden;
        white-space: nowrap;
        scrollbar-width: none;
        -ms-overflow-style: none;
        -webkit-overflow-scrolling: touch;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        touch-action: pan-y;
    }
    .month-filter::-webkit-scrollbar { display: none; }
    .month-filter.dragging { cursor: grabbing; }

    .month-chip {
        flex: 0 0 auto;
        display: inline-flex; align-items: center; gap: 6px;
        font-family: inherit; font-size: 13px; font-weight: 700;
        color: #64748b; background: #f1f5f9; border: none;
        border-radius: 11px; padding: 8px 14px; cursor: pointer;
        transition: color .2s, background .2s, box-shadow .2s, transform .15s;
        user-select: none; -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        max-width: 260px;
    }
    .month-chip .mc-text {
        overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; max-width: 200px;
    }
    .month-chip .mc-cnt {
        flex: none;
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 20px; height: 20px; padding: 0 6px;
        border-radius: 999px;
        font-size: 11px; font-weight: 800;
        background: rgba(15,23,42,.08);
        color: inherit;
    }
    .month-chip:hover { color: #2c3e50; background: #e2e8f0; }
    .month-chip.active {
        color: #fff;
        background: linear-gradient(135deg, var(--c1, #4a90e2), var(--c2, #7b68ee));
        box-shadow: 0 8px 18px -10px rgba(74,144,226,.9);
    }
    .month-chip.active .mc-cnt {
        background: rgba(255,255,255,.28);
        color: #fff;
    }
    .month-chip:active { transform: scale(.97); }

    .panel {
        background: #fff; border-radius: 26px; padding: 26px;
        box-shadow: 0 26px 50px -36px rgba(15,23,42,.9);
    }

    .empty-msg {
        text-align: center; padding: 50px 20px; color: #7f8c8d;
        font-weight: 600; font-size: 15px;
    }
    .empty-msg .em-emoji { font-size: 36px; display: block; margin-bottom: 10px; }
    .empty-msg .em-reset {
        display: inline-block; margin-top: 14px;
        font-family: inherit; font-size: 13px; font-weight: 700;
        color: #2563eb; background: #eff6ff; border: none;
        border-radius: 10px; padding: 9px 16px; cursor: pointer;
        transition: background .2s;
    }
    .empty-msg .em-reset:hover { background: #dbeafe; }

    /* ================= РАСПИСАНИЕ ================= */
    .sched { display: grid; gap: 14px; }
    .sched-day {
        padding: 18px 20px; border-radius: 18px;
        background: #f9fbfd; border: 2px solid #e8edf4;
    }
    .sched-day h4 {
        font-size: 12.5px; font-weight: 800; letter-spacing: .1em;
        text-transform: uppercase; color: #7f8c8d; margin-bottom: 12px;
        padding-bottom: 10px; border-bottom: 1px solid #e8edf4;
    }
    .sched-day ul { list-style: none; display: flex; flex-direction: column; gap: 9px; }
    .sched-day li {
        display: flex; align-items: center; gap: 11px;
        font-weight: 600; font-size: 15px; color: #2c3e50;
        line-height: 1.4; overflow-wrap: anywhere;
    }
    .sched-day li::before {
        content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%;
        background: linear-gradient(145deg, var(--c1), var(--c2));
    }
    .sched-day .empty-inline {
        color: #b0b8c4; font-size: 14px; font-weight: 500; font-style: italic;
    }

    /* ================= ТЕМЫ НЕДЕЛИ — табличный вид ================= */
    .week-list { display: flex; flex-direction: column; gap: 22px; }

    .week-card {
        border: 2px solid #e8edf4; border-radius: 18px;
        background: #fff; overflow: hidden;
        box-shadow: 0 12px 26px -20px rgba(15,23,42,.9);
    }
    .week-header {
        background: linear-gradient(135deg, var(--c1), var(--c2));
        color: #fff; padding: 14px 18px;
        text-shadow: 0 1px 4px rgba(0,0,0,.15);
    }
    .week-header .month {
        font-size: 17px; font-weight: 800; letter-spacing: .12em;
        text-transform: uppercase; text-align: center;
        margin-bottom: 8px;
    }
    .week-header .week-row {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; flex-wrap: wrap;
    }
    .week-header .week-num {
        font-size: 15px; font-weight: 800; letter-spacing: .08em;
        text-transform: uppercase;
    }
    .week-header .week-dates {
        font-size: 15px; font-weight: 700; letter-spacing: .04em;
    }

    .week-section {
        display: grid; grid-template-columns: 180px 1fr;
        border-top: 1px solid #e8edf4;
    }
    .week-section:first-of-type { border-top: none; }
    .week-label {
        background: #f9fbfd; padding: 14px 16px;
        font-size: 13px; font-weight: 800; letter-spacing: .04em;
        color: #4a5568; border-right: 1px solid #e8edf4;
        display: flex; align-items: flex-start;
        text-transform: uppercase;
    }
    .week-content {
        padding: 14px 18px; font-size: 15px; line-height: 1.55;
        color: #2c3e50; overflow-wrap: anywhere;
        white-space: pre-wrap;
    }

    .week-content .age-block {
        display: grid; grid-template-columns: 160px 1fr;
        border: 1px solid #e8edf4; border-radius: 10px;
        margin-bottom: 10px; overflow: hidden;
    }
    .week-content .age-block:last-child { margin-bottom: 0; }
    .week-content .age-name {
        background: #f1f5f9; padding: 10px 12px;
        font-size: 13.5px; font-weight: 800; color: #2c3e50;
        border-right: 1px solid #e8edf4;
        display: flex; align-items: flex-start;
    }
    .week-content .age-body {
        padding: 10px 14px;
    }
    .week-content .age-sub {
        font-size: 14.5px; font-weight: 800; color: #2c3e50;
        margin-bottom: 6px;
    }
    .week-content .age-desc {
        font-size: 14px; color: #4a5568; line-height: 1.55;
        white-space: pre-wrap;
    }
    .week-content .empty-inline {
        color: #b0b8c4; font-size: 13.5px; font-style: italic;
    }

    /* ================= РЕЖИМ ДНЯ ================= */
    .routine-list { display: flex; flex-direction: column; gap: 8px; }
    .routine-item {
        display: flex; align-items: flex-start; gap: 14px;
        padding: 12px 16px; background: #f9fbfd;
        border: 2px solid #e8edf4; border-radius: 14px;
        transition: border-color .2s;
    }
    .routine-item:hover { border-color: #cbd5e1; }
    .routine-time {
        flex: none; min-width: 110px;
        font-size: 14px; font-weight: 800; color: #2c3e50;
        background: linear-gradient(135deg, var(--c1), var(--c2));
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: .02em;
    }
    .routine-activity {
        flex: 1; min-width: 0;
        font-size: 15px; font-weight: 600; color: #2c3e50;
        line-height: 1.4; overflow-wrap: anywhere;
    }

    /* ================= ХУДОЖ. ЛИТЕРАТУРА — таблица ================= */
    .lit-months { display: flex; flex-direction: column; gap: 26px; }

    .lit-month-title {
        display: block;
        padding: 14px 20px;
        border-radius: 14px 14px 0 0;
        background: linear-gradient(135deg, var(--c1), var(--c2));
        color: #fff;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: .08em;
        text-transform: uppercase;
        text-shadow: 0 1px 3px rgba(0,0,0,.2);
    }

    .lit-table-wrap {
        overflow-x: auto;
        border-radius: 0 0 16px 16px;
        border: 2px solid #e8edf4;
        border-top: none;
        background: #fff;
    }

    .lit-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 720px;
        font-size: 14px;
    }

    .lit-table thead th {
        background: #f1f5f9;
        color: #4a5568;
        font-weight: 800;
        font-size: 11.5px;
        letter-spacing: .07em;
        text-transform: uppercase;
        text-align: left;
        padding: 12px 14px;
        border-right: 1px solid #e8edf4;
        border-bottom: 2px solid #e8edf4;
        vertical-align: middle;
    }
    .lit-table thead th:last-child { border-right: none; }

    .lit-table tbody td {
        padding: 12px 14px;
        border-top: 1px solid #e8edf4;
        border-right: 1px solid #e8edf4;
        color: #2c3e50;
        font-weight: 600;
        line-height: 1.55;
        vertical-align: top;
        overflow-wrap: anywhere;
    }
    .lit-table tbody td:last-child { border-right: none; }
    .lit-table tbody tr:nth-child(even) td { background: #f9fbfd; }
    .lit-table tbody tr:hover td { background: #eff6ff; }

    .lit-table .lit-num-cell {
        text-align: center;
        font-weight: 800;
        color: #4a90e2;
        width: 44px;
    }

    /* --- админ: редактор худ. литературы --- */
    .lit-weeks-editor { display: flex; flex-direction: column; gap: 10px; }

    .lit-week-edit {
        display: grid;

function loadState() {

        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        const s = JSON.parse(raw);
        if (!s.settings) s.settings = JSON.parse(JSON.stringify(DEFAULT_STATE.settings));
        if (!Array.isArray(s.calendar)) s.calendar = [];
        if (!Array.isArray(s.groups)) s.groups = JSON.parse(JSON.stringify(DEFAULT_STATE.groups));
        s.groups.forEach(g => {
            if (!Array.isArray(g.lessonSchedule) || !g.lessonSchedule.length)
                g.lessonSchedule = defaultLessonSchedule();
            if (!Array.isArray(g.weeklyThemes)) g.weeklyThemes = [];
            g.weeklyThemes = g.weeklyThemes.map(t => {
                if (t.dooTheme !== undefined || t.ageSubtopics !== undefined) {
                    return {
                        id: t.id || uid(),
                        month: t.month || '',
                        weekNumber: t.weekNumber || '',
                        dates: t.dates || '',
                        dooTheme: t.dooTheme || '',
                        dooDescription: t.dooDescription || '',
                        ageSubtopics: Array.isArray(t.ageSubtopics) ? t.ageSubtopics : [],
                        holidays: t.holidays || ''
                    };
                }
                return {
                    id: t.id || uid(),
                    month: '',
                    weekNumber: '',
                    dates: t.week || '',
                    dooTheme: t.title || '',
                    dooDescription: t.desc || '',
                    ageSubtopics: [],
                    holidays: ''
                };
            });
            if (!Array.isArray(g.dailyRoutine) || !g.dailyRoutine.length)
                g.dailyRoutine = defaultDailyRoutine();
            if (!Array.isArray(g.artLiterature)) g.artLiterature = [];
            g.artLiterature = g.artLiterature
                .filter(m => m && Array.isArray(m.weeks))
                .map(m => ({
                    id: m.id || uid(),
                    month: m.month || '',
                    weeks: m.weeks.map(w => ({
                        id: w.id || uid(),
                        week: w.week || '',
                        theme: w.theme || '',
                        works: w.works || '',
                        tasks: w.tasks || ''
                    }))
                }));
            if (!Array.isArray(g.morningCircle)) g.morningCircle = defaultMorningCircle();

            if (Array.isArray(g.events) && g.events.length) {
                g.events.forEach(ev => {
                    if (!s.calendar.find(x => x.id === ev.id)) {
                        s.calendar.push({
                            id: ev.id || uid(),

                            title: ev.title,
                            color: ev.color || '#4a90e2'

                    }

                g.events = [];
            }
        });
        return s;
    } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }
}

/* ============================================================
   ПЕРЕТАСКИВАНИЕ ПОЛОСЫ
   ============================================================ */
function makeDraggableScroller(el) {
    if (!el || el._dragInit) return;
    el._dragInit = true;

    let isDown = false;
    let startX = 0;
    let startScrollLeft = 0;
    let moved = false;
    let lastX = 0, lastTime = 0, velocity = 0;

    const onDown = (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        isDown = true;
        moved = false;
        startX = e.clientX;
        startScrollLeft = el.scrollLeft;
        lastX = e.clientX;
        lastTime = performance.now();
        velocity = 0;
        el.classList.add('dragging');
    };
    const onMove = (e) => {
        if (!isDown) return;
        const dx = e.clientX - startX;
        if (!moved && Math.abs(dx) > 6) moved = true;
        if (moved) {
            el.scrollLeft = startScrollLeft - dx;
            if (e.cancelable) e.preventDefault();
        }
        const now = performance.now();
        const dt = now - lastTime;
        if (dt > 0) velocity = (e.clientX - lastX) / dt;
        lastX = e.clientX;
        lastTime = now;
    };
    const onUp = () => {
        if (!isDown) return;
        isDown = false;
        el.classList.remove('dragging');
        if (moved && Math.abs(velocity) > 0.2) {
            let v = velocity * 12;
            const step = () => {
                el.scrollLeft -= v;
                v *= 0.94;
                if (Math.abs(v) > 0.4) requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
        }
        velocity = 0;
    };

    el.addEventListener('click', (e) => {
        if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }
    }, true);
    el.addEventListener('pointerdown', onDown);
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', onUp);
    el.addEventListener('pointerleave', () => { if (isDown) onUp(); });
    el.addEventListener('dragstart', e => e.preventDefault());
}

/* ============================================================
   УНИВЕРСАЛЬНАЯ СОРТИРОВКА ПЕРЕТАСКИВАНИЕМ
   ============================================================ */
function makeSortable(container, opts = {}) {
    if (!container) return;
    if (container._sortableCleanup) container._sortableCleanup();

    const itemSel   = opts.itemSelector  || '[data-sortable-item]';
    const handleSel = opts.handleSelector || null;
    const onReorder = typeof opts.onReorder === 'function' ? opts.onReorder : () => {};

    let dragEl = null, placeholder = null, ghost = null;
    let startX = 0, startY = 0, pointerId = null;
    let dragging = false, items = [], offsetY = 0;

    const getItems = () =>
        Array.from(container.children).filter(el => el.matches && el.matches(itemSel));

    const getAfterEl = (y) => {
        const els = getItems().filter(el => el !== dragEl && el !== placeholder);
        let closest = null, closestOffset = -Infinity;
        els.forEach(el => {
            const r = el.getBoundingClientRect();
            const off = y - r.top - r.height / 2;
            if (off < 0 && off > closestOffset) { closestOffset = off; closest = el; }
        });
        return closest;
    };

    const onMove = (ev) => {
        if (ev.pointerId !== pointerId) return;
        const dx = ev.clientX - startX;
        const dy = ev.clientY - startY;
        if (!dragging) {
            if (Math.hypot(dx, dy) < 7) return;
            if (!handleSel && Math.abs(dy) <= Math.abs(dx)) { finish(); return; }
            beginDrag(ev);
        }
        if (dragging) {
            if (ev.cancelable) ev.preventDefault();
            ghost.style.top = (ev.clientY - offsetY) + 'px';
            const after = getAfterEl(ev.clientY);
            if (after) container.insertBefore(placeholder, after);
            else       container.appendChild(placeholder);
        }
    };

    const onUp = (ev) => {
        if (ev.pointerId !== pointerId) return;
        if (dragging) endDrag();
        finish();
    };

    const beginDrag = (ev) => {
        dragging = true;
        items = getItems();
        const rect = dragEl.getBoundingClientRect();
        offsetY = ev.clientY - rect.top;

        placeholder = document.createElement('div');
        placeholder.className = 'sortable-placeholder';
        placeholder.style.height = rect.height + 'px';
        container.insertBefore(placeholder, dragEl);

        ghost = dragEl.cloneNode(true);
        ghost.classList.add('sortable-ghost');
        ghost.style.cssText +=
            `position:fixed;left:${rect.left}px;top:${rect.top}px;` +
            `width:${rect.width}px;height:${rect.height}px;` +
            `margin:0;z-index:9999;opacity:.92;transform:scale(1.02);`;
        document.body.appendChild(ghost);

        dragEl.classList.add('sortable-dragging');
        dragEl.style.display = 'none';
        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'grabbing';
    };

    const endDrag = () => {
        if (ghost) ghost.remove();
        dragEl.classList.remove('sortable-dragging');
        dragEl.style.display = '';
        container.insertBefore(dragEl, placeholder);
        placeholder.remove();
        document.body.style.userSelect = '';
        document.body.style.cursor = '';

        const from = items.indexOf(dragEl);
        const to   = getItems().indexOf(dragEl);
        dragging = false; dragEl = null; ghost = null; placeholder = null; items = [];

        if (from !== to && from >= 0 && to >= 0) {
            container._suppressClick = true;
            setTimeout(() => { container._suppressClick = false; }, 80);
            onReorder(from, to);
        }
    };

    const finish = () => {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
        pointerId = null;
    };

    const onDown = (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (handleSel && !e.target.closest(handleSel)) return;
        const item = e.target.closest(itemSel);
        if (!item || item.parentElement !== container) return;

        dragEl = item;
        startX = e.clientX;
        startY = e.clientY;
        pointerId = e.pointerId;

        window.addEventListener('pointermove', onMove, { passive: false });
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
    };

    const onClickCapture = (ev) => {
        if (container._suppressClick) {
            ev.stopPropagation();
            ev.preventDefault();
            container._suppressClick = false;
        }
    };

    container.addEventListener('pointerdown', onDown);
    container.addEventListener('click', onClickCapture, true);
    container._sortableCleanup = () => {
        container.removeEventListener('pointerdown', onDown);
        container.removeEventListener('click', onClickCapture, true);
    };
}

/* ---------- ФИЛЬТР ПО МЕСЯЦАМ ---------- */
function monthsSupportFilter(tab) {
    return tab === 'weeklyThemes' || tab === 'artLiterature';
}

/**
 * Возвращает массив { key, label, count } уникальных месяцев
 * для текущей вкладки и группы.
 */
function collectMonths(g, tab) {
    const map = new Map();
    if (tab === 'weeklyThemes') {
        (g.weeklyThemes || []).forEach(t => {
            const key = (t.month || '').trim();
            if (!key) return;
            if (!map.has(key)) map.set(key, { key, label: key, count: 0 });
            map.get(key).count++;
        });
    } else if (tab === 'artLiterature') {
        (g.artLiterature || []).forEach(m => {
            const key = (m.month || '').trim();
            if (!key) return;
            if (!map.has(key)) map.set(key, { key, label: key, count: 0 });
            map.get(key).count += (m.weeks || []).length || 1;
        });
    }
    return Array.from(map.values());
}

function renderMonthFilterHTML(g) {
    if (!monthsSupportFilter(currentGroupTab)) return '';
    const months = collectMonths(g, currentGroupTab);
    if (!months.length) return '';

    // если выбранный ранее месяц исчез — сбрасываем фильтр
    if (currentMonthFilter !== 'all' && !months.some(m => m.key === currentMonthFilter)) {
        currentMonthFilter = 'all';
    }

    const total = months.reduce((s, m) => s + m.count, 0);
    const chips = [
        { key: 'all', label: 'Все месяцы', count: total },
        ...months
    ];

    return `
        <div class="month-filter-wrap">
            <span class="mf-label">🗓 Месяц:</span>
            <div class="month-filter" id="monthFilter">
                ${chips.map(c => `
                    <button class="month-chip ${currentMonthFilter === c.key ? 'active' : ''}"
                            data-month="${escHtml(c.key)}"
                            title="${escHtml(c.label)}">
                        <span class="mc-text">${escHtml(c.label)}</span>
                        <span class="mc-cnt">${c.count}</span>
                    </button>
                `).join('')}
            </div>
        </div>
    `;
}

function bindMonthFilter(g) {
    const mf = document.getElementById('monthFilter');
    if (!mf) return;
    makeDraggableScroller(mf);

    // Центрируем активный чип
    const active = mf.querySelector('.month-chip.active');
    if (active) {
        requestAnimationFrame(() => {
            const target = active.offsetLeft - (mf.clientWidth - active.clientWidth) / 2;
            mf.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
        });
    }

    mf.addEventListener('click', (e) => {
        const chip = e.target.closest('.month-chip');
        if (!chip) return;
        if (chip.dataset.month === currentMonthFilter) return;
        currentMonthFilter = chip.dataset.month;
        mf.querySelectorAll('.month-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');

        // Перерисовываем только панель контента
        if (currentGroupTab === 'weeklyThemes')      renderGroupWeeklyThemes(g);
        else if (currentGroupTab === 'artLiterature') renderGroupArtLiterature(g);
    });
}

    el.style.setProperty('--c1', cs.getPropertyValue('--c1').trim());
    el.style.setProperty('--c2', cs.getPropertyValue('--c2').trim());
    document.body.removeChild(test);
}

function renderGroupCalendar() {
    const panel = document.getElementById('groupPanel');

    const firstDay = new Date(calYear, calMonth, 1);
    const startDow = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const prevMonthDays = new Date(calYear, calMonth, 0).getDate();

    const eventsByDate = {};
    (state.calendar || []).forEach(ev => {
        if (!ev.date) return;
        if (!eventsByDate[ev.date]) eventsByDate[ev.date] = [];
        eventsByDate[ev.date].push(ev);
    });

    const t = new Date();
    const todayStr = `${t.getFullYear()}-${pad2(t.getMonth()+1)}-${pad2(t.getDate())}`;

    const cells = [];
    for (let i = startDow - 1; i >= 0; i--) {
        const day = prevMonthDays - i;
        cells.push({ day, other: true, date: toISODate(new Date(calYear, calMonth - 1, day)) });
    }
    for (let d = 1; d <= daysInMonth; d++) {
        cells.push({ day: d, other: false, date: toISODate(new Date(calYear, calMonth, d)) });
    }
    while (cells.length % 7 !== 0) {
        const nextDay = cells.length - (startDow + daysInMonth) + 1;
        cells.push({ day: nextDay, other: true, date: toISODate(new Date(calYear, calMonth + 1, nextDay)) });
    }

    const isAdm = isAdmin();

    panel.innerHTML = `
        <div class="cal-badge">🌍 Общий календарь — отображается одинаково во всех группах</div>

        <div class="cal-header">
            <div style="display:flex;align-items:center;gap:12px;">
                <button class="cal-nav-btn" id="calPrev" title="Предыдущий месяц">‹</button>
                <div class="cal-month-title">${MONTHS_RU[calMonth]} ${calYear}</div>
                <button class="cal-nav-btn" id="calNext" title="Следующий месяц">›</button>
            </div>
            <button class="cal-today-btn" id="calToday">Сегодня</button>
        </div>

        <div class="cal-grid">
            ${DOW_SHORT.map(d => `<div class="cal-dow">${d}</div>`).join('')}
            ${cells.map(c => {
                const evs = eventsByDate[c.date] || [];
                const isToday = c.date === todayStr;
                const hasEv = evs.length > 0;
                return `
                    <div class="cal-day ${c.other ? 'other-month' : ''} ${isToday ? 'today' : ''} ${hasEv ? 'has-event' : ''}"
                         data-date="${c.date}"
                         title="${hasEv ? evs.map(e => e.title).join('\n') : 'Нажмите, чтобы добавить событие'}">
                        <div class="cal-day-num">${c.day}</div>
                        ${evs.slice(0, 3).map(ev => `
                            <div class="cal-event" style="color:${ev.color};"
                                 title="${escHtml(ev.title)}">${escHtml(ev.title)}</div>
                        `).join('')}
                        ${evs.length > 3 ? `<div class="cal-more">+${evs.length - 3}</div>` : ''}
                    </div>
                `;
            }).join('')}
        </div>

        ${isAdm
            ? `<div class="cal-hint">💡 Нажмите на любую ячейку, чтобы открыть её события или добавить новое. Цвет — это цвет текста названия. Заполняется для всех групп одинаково.</div>`
            : `<div class="cal-hint" style="background:#f1f5f9;color:#7f8c8d;">👁 Режим просмотра. Нажмите на ячейку, чтобы увидеть события дня.</div>`
        }
    `;

    document.getElementById('calPrev').onclick = () => {
        calMonth--;
        if (calMonth < 0) { calMonth = 11; calYear--; }
        renderGroupCalendar();
    };
    document.getElementById('calNext').onclick = () => {
        calMonth++;
        if (calMonth > 11) { calMonth = 0; calYear++; }
        renderGroupCalendar();
    };
    document.getElementById('calToday').onclick = () => {
        const n = new Date();
        calYear = n.getFullYear();
        calMonth = n.getMonth();
        renderGroupCalendar();
    };

    panel.querySelectorAll('.cal-day').forEach(cell => {
        cell.onclick = () => { openEventModal(cell.dataset.date, null); };
    });
}

function openEventModal(dateISO, eventId) {
    const adm = isAdmin();
    if (!Array.isArray(state.calendar)) state.calendar = [];

    editingEvent = eventId ? state.calendar.find(e => e.id === eventId) : null;
    if (adm) {
        selectedEventColor = editingEvent ? editingEvent.color : EVENT_PALETTE[0];
    }

    const box = document.getElementById('eventBox');
    const dayEvents = state.calendar.filter(e => e.date === dateISO);

    box.innerHTML = `
        <h3>🗓 ${fmtDate(dateISO)}</h3>
        <p class="sub">Общий календарь · событий: ${dayEvents.length}</p>

        ${dayEvents.length ? `
            <div class="event-list">
                ${dayEvents.map(e => `
                    <div class="row">
                        <span class="txt" style="color:${e.color};">${escHtml(e.title)}</span>
                        ${adm ? `
                            <button class="mini-btn edit" data-edit="${e.id}" title="Редактировать">✏️</button>
                            <button class="mini-btn del"  data-del="${e.id}"  title="Удалить">✕</button>
                        ` : ''}
                    </div>
                `).join('')}
            </div>
        ` : `<div class="empty-msg" style="padding:20px 10px;">На этот день событий пока нет.</div>`}

        ${adm ? `
            <div class="field" style="margin-top:16px;">
                <label>${editingEvent ? 'Изменить название' : 'Новое событие'}</label>
                <input type="text" id="evTitle" maxlength="60"
                       placeholder="Например: Осенний утренник"
                       value="${editingEvent ? escHtml(editingEvent.title) : ''}">
            </div>
            <div class="field">
                <label>Дата</label>
                <input type="date" id="evDate" value="${editingEvent ? editingEvent.date : dateISO}">
            </div>
            <div class="field">
                <label>Цвет текста события</label>
                <div class="palette" id="evPalette">
                    ${EVENT_PALETTE.map(col => `
                        <div class="swatch ${col === selectedEventColor ? 'selected' : ''}"
                             data-color="${col}"
                             style="background:${col}"
                             title="${col}"></div>
                    `).join('')}
                    <label class="color-custom-wrap" title="Выбрать свой цвет">
                        <input type="color" id="evCustomColor" value="${selectedEventColor}">
                        <span>Свой</span>
                    </label>
                </div>
                <div class="color-preview-line">
                    <span class="lbl-mini">Как будет в календаре:</span>
                    <span class="dot" id="pvDot" style="background:${selectedEventColor};"></span>
                    <span id="pvText" style="color:${selectedEventColor};">Осенний утренник</span>
                </div>
            </div>

            <div class="actions">
                <button class="btn primary" id="evSave">${editingEvent ? 'Сохранить' : 'Добавить'}</button>
                ${editingEvent ? `<button class="btn ghost" id="evNew">Отменить редактирование</button>` : ''}
                <button class="btn ghost"   id="evCancel">Закрыть</button>
            </div>
        ` : `
            <div class="actions">
                <button class="btn ghost" id="evCancel">Закрыть</button>
            </div>
        `}
    `;

    if (adm) {
        const pvDot  = document.getElementById('pvDot');
        const pvText = document.getElementById('pvText');

        box.querySelectorAll('#evPalette .swatch').forEach(sw => {
            sw.onclick = () => {
                selectedEventColor = sw.dataset.color;
                box.querySelectorAll('#evPalette .swatch').forEach(s => s.classList.remove('selected'));
                sw.classList.add('selected');
                document.getElementById('evCustomColor').value = selectedEventColor;
                pvDot.style.background = selectedEventColor;
                pvText.style.color = selectedEventColor;
            };
        });
        document.getElementById('evCustomColor').oninput = (e) => {
            selectedEventColor = e.target.value;
            box.querySelectorAll('#evPalette .swatch').forEach(s => s.classList.remove('selected'));
            pvDot.style.background = selectedEventColor;
            pvText.style.color = selectedEventColor;
        };

        box.querySelectorAll('[data-edit]').forEach(b => {
            b.onclick = () => {
                const ev = state.calendar.find(x => x.id === b.dataset.edit);
                openEventModal(ev.date, ev.id);
            };
        });
        box.querySelectorAll('[data-del]').forEach(b => {
            b.onclick = () => {
                const idx = state.calendar.findIndex(x => x.id === b.dataset.del);
                if (idx >= 0) {
                    state.calendar.splice(idx, 1);
                    saveState();
                    renderGroupCalendar();
                    openEventModal(dateISO, null);
                    toast('Событие удалено');
                }
            };
        });

        document.getElementById('evSave').onclick = () => {
            const title = document.getElementById('evTitle').value.trim();
            const date  = document.getElementById('evDate').value;
            if (!title) { alert('Введите название события'); return; }
            if (!date)  { alert('Выберите дату'); return; }

            if (editingEvent) {
                editingEvent.title = title;
                editingEvent.date  = date;
                editingEvent.color = selectedEventColor;
            } else {
                state.calendar.push({
                    id: uid(),
                    title, date,
                    color: selectedEventColor
                });
            }
            saveState();
            renderGroupCalendar();
            closeEventModal();
            toast('Сохранено для всех групп');
        };

        const evNew = document.getElementById('evNew');
        if (evNew) {
            evNew.onclick = () => {
                editingEvent = null;
                selectedEventColor = EVENT_PALETTE[0];
                openEventModal(dateISO, null);
            };
        }
    }

    document.getElementById('evCancel').onclick = closeEventModal;

    document.getElementById('eventModal').classList.add('active');
    if (adm) setTimeout(() => {
        const inp = document.getElementById('evTitle');
        if (inp) inp.focus();
    }, 100);
}
function closeEventModal() {
    document.getElementById('eventModal').classList.remove('active');
    editingEvent = null;
}
document.getElementById('eventModal').addEventListener('click', e => {
    if (e.target.id === 'eventModal') closeEventModal();
});

/* ---------- Админ: Содержимое групп ---------- */
function renderAdminContent() {
    const body = document.getElementById('adminBody');
    if (!state.groups.length) {
        body.innerHTML = `<div class="empty-msg">Сначала добавьте группы на вкладке «Группы».</div>`;
        return;
    }
    if (adminGroupId >= state.groups.length) adminGroupId = 0;
    const g = state.groups[adminGroupId];

    const subTabs = [
        ['schedule',      '📅 Расписания занятий'],
        ['weeklyThemes',  '📖 Темы недели'],
        ['dailyRoutine',  '🕐 Режим дня'],
        ['artLiterature', '📚 Худож. литература'],
        ['morningCircle', '🌅 Утренний круг']
    ];

    body.innerHTML = `
        <div class="admin-card" style="border-top-color:#94A3B8;">
            <div class="admin-fields">
                <div class="a-field wide">
                    <label>Выберите группу</label>
                    <select id="groupPicker">
                        ${state.groups.map((gr, i) =>
                            `<option value="${i}" ${i === adminGroupId ? 'selected' : ''}>
                                ${escHtml(gr.emoji)} ${escHtml(gr.name)} — ${escHtml(gr.age)}
                            </option>`
                        ).join('')}
                    </select>
                </div>
            </div>
        </div>
        <div class="admin-nav" id="adminSubTabs">
            ${subTabs.map(([k, lbl]) => `
                <button data-ctab="${k}" class="${adminContentTab === k ? 'active' : ''}">${lbl}</button>
            `).join('')}
        </div>
        <div id="adminContentBody"></div>
    `;

    const subTabsEl = document.getElementById('adminSubTabs');
    makeDraggableScroller(subTabsEl);

    document.getElementById('groupPicker').onchange = (e) => {
        adminGroupId = Number(e.target.value);
        renderAdminContent();
    };

    subTabsEl.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-ctab]');
        if (!btn) return;
        if (btn.dataset.ctab === adminContentTab) return;
        adminContentTab = btn.dataset.ctab;
        renderAdminContent();
    });

    if (adminContentTab === 'schedule')           renderAdminSchedule(g);
    else if (adminContentTab === 'weeklyThemes')  renderAdminWeeklyThemes(g);
    else if (adminContentTab === 'dailyRoutine')  renderAdminDailyRoutine(g);

    else                                           renderAdminMorningCircle(g);
}

/* --- Админ: расписание --- */
function renderAdminSchedule(g) {
    if (!Array.isArray(g.lessonSchedule) || !g.lessonSchedule.length) {
        g.lessonSchedule = defaultLessonSchedule();
    }
    const box = document.getElementById('adminContentBody');
    box.innerHTML = `
        <div class="add-section">
            <h3>📅 Расписание занятий по дням недели</h3>
            <p style="color:#7f8c8d;font-size:13.5px;font-weight:600;margin-bottom:14px;">
                Перетаскивайте занятия за ручку ⋮⋮, чтобы менять порядок внутри дня.
            </p>
            <div id="scheduleEditor"></div>
        </div>
    `;
    const editor = document.getElementById('scheduleEditor');

    g.lessonSchedule.forEach((d, di) => {
        const card = document.createElement('div');
        card.className = 'admin-card';
        card.innerHTML = `
            <div class="admin-card-head">
                <div class="admin-emoji">📅</div>
                <div class="admin-name">${escHtml(d.day)}</div>
            </div>
            <div class="sched-items" style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px;">
                ${(d.items || []).map((it, ii) => `
                    <div class="sched-item" data-sortable-item style="display:flex;gap:8px;align-items:center;">
                        <span class="drag-handle" data-drag-handle title="Перетащите">⋮⋮</span>
                        <input type="text" data-di="${di}" data-ii="${ii}"
                               value="${escHtml(it)}" maxlength="60"
                               placeholder="Название занятия"
                               style="flex:1;min-width:0;font-family:inherit;font-size:14.5px;font-weight:600;
                                      color:#2c3e50;background:#f9fbfd;border:2px solid #e8edf4;
                                      border-radius:11px;padding:10px 12px;outline:none;">
                        <button class="icon-btn danger" data-del="${di}-${ii}" title="Удалить">✕</button>
                    </div>
                `).join('')}
            </div>
            <div class="admin-actions">
                <button class="btn ghost" data-add="${di}">+ Добавить занятие</button>
            </div>
        `;
        editor.appendChild(card);
    });

    editor.querySelectorAll('input[data-di]').forEach(inp => {
        inp.addEventListener('input', () => {
            const di = Number(inp.dataset.di);
            const ii = Number(inp.dataset.ii);
            g.lessonSchedule[di].items[ii] = inp.value;
            saveState();
        });
    });
    editor.querySelectorAll('[data-del]').forEach(btn => {
        btn.onclick = () => {
            const [di, ii] = btn.dataset.del.split('-').map(Number);
            g.lessonSchedule[di].items.splice(ii, 1);
            saveState();
            renderAdminSchedule(g);
        };
    });
    editor.querySelectorAll('[data-add]').forEach(btn => {
        btn.onclick = () => {
            const di = Number(btn.dataset.add);
            g.lessonSchedule[di].items.push('');
            saveState();
            renderAdminSchedule(g);
            requestAnimationFrame(() => {
                const inputs = editor.querySelectorAll(`input[data-di="${di}"]`);
                const last = inputs[inputs.length - 1];
                if (last) last.focus();
            });
        };
    });

    editor.querySelectorAll('.sched-items').forEach((boxItems) => {
        makeSortable(boxItems, {
            handleSelector: '[data-drag-handle]',
            onReorder: (from, to) => {
                const firstInput = boxItems.children[0]?.querySelector('input');
                if (!firstInput) return;
                const dayIdx = Number(firstInput.dataset.di);
                const arr = g.lessonSchedule[dayIdx].items;
                arr.splice(to, 0, arr.splice(from, 1)[0]);
                saveState();

                Array.from(boxItems.children).forEach((row, idx) => {
                    const inp = row.querySelector('input');
                    if (inp) inp.dataset.ii = idx;
                    const del = row.querySelector('[data-del]');
                    if (del) del.dataset.del = dayIdx + '-' + idx;
                });
            }
        });
    });
}

    function addAgeRow(age) {
        age = age || { age: '', subtopic: '', description: '' };

        addAgeRow();

function collectWeekForm(form) {
    const get = n => (form.querySelector(`[name="${n}"]`)?.value || '').trim();
    const ages = [];
    form.querySelectorAll('.age-edit-row').forEach(row => {
        const age = row.querySelector('[data-age="age"]').value.trim();
        const subtopic = row.querySelector('[data-age="subtopic"]').value.trim();
        const description = row.querySelector('[data-age="description"]').value.trim();
        if (age || subtopic || description) {
            ages.push({ age, subtopic, description });
        }
    });
    return {
        month: get('month'),
        weekNumber: get('weekNumber'),
        dates: get('dates'),
        dooTheme: get('dooTheme'),
        dooDescription: get('dooDescription'),
        ageSubtopics: ages,
        holidays: get('holidays')
    };
}

   РОУТЕР
   ============================================================ */
function router() {
    const hash = location.hash.replace(/^#\/?/, '');
    const parts = hash.split('/').filter(Boolean);

    document.getElementById('homeView').style.display  = 'none';
    document.getElementById('groupView').style.display = 'none';
    document.getElementById('adminView').style.display = 'none';

    if (parts[0] === 'group' && parts[1] !== undefined) {
        const prevGroupId = currentGroupId;
        const prevTab = currentGroupTab;
        currentGroupId = Number(parts[1]) || 0;
        currentGroupTab = parts[2] || 'schedule';
        if (!GROUP_TABS.find(([k]) => k === currentGroupTab)) currentGroupTab = 'schedule';

        // Сброс фильтра при смене группы или вкладки
        if (prevGroupId !== currentGroupId || prevTab !== currentGroupTab) {
            currentMonthFilter = 'all';
        }

        if (currentGroupId >= state.groups.length) { location.hash = '#/'; return; }
        document.getElementById('groupView').style.display = 'block';
        renderGroupPage();
        window.scrollTo(0, 0);
    } else if (parts[0] === 'admin') {
        if (!isAdmin()) { showLogin(); location.hash = '#/'; return; }
        document.getElementById('adminView').style.display = 'block';
        renderAdmin();
        window.scrollTo(0, 0);
    } else {
        document.getElementById('homeView').style.display = 'block';
        renderHome();
        window.scrollTo(0, 0);
    }

    updateHeaderAuth();
}

function showLogin() {
    document.getElementById('loginOverlay').classList.add('active');
    document.getElementById('loginError').textContent = '';
    document.getElementById('loginPassword').value = '';
    setTimeout(() => document.getElementById('loginPassword').focus(), 100);
}
function hideLogin() { document.getElementById('loginOverlay').classList.remove('active'); }

document.getElementById('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    const pwd = document.getElementById('loginPassword').value;
    if (pwd === ADMIN_PASSWORD) {
        authToken = 'tok_' + Date.now();
        sessionStorage.setItem(TOKEN_KEY, authToken);
        hideLogin();
        location.hash = '#/admin';
        router();
    } else {
        document.getElementById('loginError').textContent = 'Неверный пароль';
        document.getElementById('loginPassword').value = '';
        document.getElementById('loginPassword').focus();
    }
});
document.getElementById('loginOverlay').addEventListener('click', e => {
    if (e.target.id === 'loginOverlay') hideLogin();
});

function logoutAndReturnHome() {
    authToken = null;
    sessionStorage.removeItem(TOKEN_KEY);
    adminTab = 'groups';
    adminContentTab = 'schedule';
    location.hash = '#/';
    router();
    toast('Вы вышли из админ-панели');
}

document.getElementById('userBtn').addEventListener('click', () => {
    if (isAdmin()) location.hash = '#/admin';
    else showLogin();
});
document.getElementById('logoutHeaderBtn').addEventListener('click', logoutAndReturnHome);
document.getElementById('logoBtn').addEventListener('click', () => { location.hash = '#/'; });

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { hideLogin(); closeEventModal(); closeModal(); }
});
function closeModal() { document.getElementById('modal').classList.remove('active'); }

/* ============================================================
   ЗАЩИТА ОТ КОПИРОВАНИЯ КОНТЕНТА
   ============================================================ */
(function protectContent() {
    const EDITABLE_SEL = 'input, textarea, select, [contenteditable="true"]';

    const inEditable = (e) => {
        const t = e.target;
        if (!t) return false;
        if (t.isContentEditable) return true;
        const tag = (t.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || tag === 'select') return true;
        return !!(t.closest && t.closest(EDITABLE_SEL));
    };

    document.addEventListener('selectstart', e => {
        if (!inEditable(e)) e.preventDefault();
    }, true);

    const blockClipboard = (e) => {
        if (inEditable(e)) return;
        e.preventDefault();
        try {
            if (e.clipboardData) e.clipboardData.setData('text/plain', '');
        } catch (_) {}
        return false;
    };
    document.addEventListener('copy',  blockClipboard, true);
    document.addEventListener('cut',   blockClipboard, true);
    document.addEventListener('paste', blockClipboard, true);

    document.addEventListener('contextmenu', e => {
        if (!inEditable(e)) e.preventDefault();
    }, true);

    document.addEventListener('dragstart', e => {
        if (!inEditable(e)) e.preventDefault();
    }, true);
    document.addEventListener('drop', e => {
        if (!inEditable(e)) e.preventDefault();
    }, true);

    document.addEventListener('keydown', e => {
        const k = (e.key || '').toLowerCase();
        const mod = e.ctrlKey || e.metaKey;

        if (inEditable(e) && mod && ['c', 'v', 'x', 'a', 'z', 'y'].includes(k)) return;

        if (e.key === 'F12') { e.preventDefault(); return false; }

        if (mod) {
            if (['c', 'x', 'a', 'u', 's', 'p'].includes(k)) {
                e.preventDefault();
                return false;
            }
            if (e.shiftKey && ['i', 'j', 'c', 'k'].includes(k)) {
                e.preventDefault();
                return false;
            }
        }
        if (e.ctrlKey && k === 'insert') { e.preventDefault(); return false; }
        if (e.shiftKey && k === 'insert' && !inEditable(e)) { e.preventDefault(); return false; }
    }, true);

    document.addEventListener('mousedown', e => {
        if (e.detail > 1 && !inEditable(e)) e.preventDefault();
    }, true);
})();

window.addEventListener('hashchange', router);
router();
</script>
