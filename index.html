<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кабинет воспитателя</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --text:#1f2937; --muted:#6b7280; --line:#e8edf4; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding: 24px 20px 70px;
    background:
      radial-gradient(1200px 600px at 8% -10%, #e0f2fe 0%, transparent 60%),
      radial-gradient(1000px 520px at 100% 0%, #fef3c7 0%, transparent 55%),
      #f4f7fb;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }
  .topbar {
    display:flex; justify-content:flex-end; align-items:center;
    gap:10px; margin-bottom:10px; min-height:44px; flex-wrap:wrap;
  }
  .admin-link, .user-badge {
    display:inline-flex; align-items:center; gap:6px;
    font-size:14px; font-weight:700; text-decoration:none; color:var(--text);
    background:#fff; border-radius:14px; padding:10px 16px;
    box-shadow:0 10px 20px -16px rgba(15,23,42,.9);
    transition:transform .2s, box-shadow .2s;
    border:none; font-family:inherit; cursor:pointer;
  }
  .admin-link:hover { transform:translateY(-2px); box-shadow:0 14px 24px -16px rgba(15,23,42,.9); }
  .user-badge { background:#ecfdf5; color:#065f46; cursor:default; padding:10px 14px; }
  .logout-btn { color:#dc2626; background:#fee2e2; }
  .logout-btn:hover { background:#fecaca; }

  .hero { text-align:center; margin-bottom:34px; }
  .hero h1 { font-size:clamp(28px,4.2vw,46px); letter-spacing:-.025em; line-height:1.1; white-space:pre-line; }
  .hero p { color:var(--muted); margin-top:10px; font-size:17px; font-weight:500; white-space:pre-line; }
  .welcome {
    text-align:center; font-size:16px; font-weight:500; color:var(--muted);
    margin-top:-14px; margin-bottom:32px; white-space:pre-line; line-height:1.6;
  }

  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:22px; }
  .card {
    position:relative; aspect-ratio:1/1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; padding:22px; text-align:center; text-decoration:none; color:#fff;
    border-radius:30px;
    background:linear-gradient(145deg,var(--c1),var(--c2));
    box-shadow:0 14px 28px -16px rgba(15,23,42,.65);
    overflow:hidden;
    transition:transform .28s cubic-bezier(.2,.8,.3,1), box-shadow .28s;
    text-shadow:0 2px 8px rgba(0,0,0,.22);
  }
  .card::after {
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 46%);
    pointer-events:none;
  }
  .card:hover, .card:focus-visible {
    transform:translateY(-9px) scale(1.02);
    box-shadow:0 30px 46px -22px rgba(15,23,42,.75); outline:none;
  }
  .card-emoji { font-size:58px; line-height:1; filter:drop-shadow(0 5px 10px rgba(0,0,0,.25)); }
  .card-name { font-size:27px; font-weight:800; letter-spacing:-.015em; margin-top:10px; }
  .card-sub { font-size:12.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; opacity:.92; }
  .card-count {
    position:absolute; bottom:18px; font-size:13px; font-weight:700;
    padding:5px 14px; border-radius:999px;
    background:rgba(255,255,255,.26); backdrop-filter:blur(6px);
  }

  .back {
    display:inline-flex; align-items:center; gap:6px;
    font-family:inherit; font-size:15px; font-weight:700; color:var(--text);
    background:#fff; border:none; border-radius:16px; padding:12px 20px;
    margin-bottom:20px; cursor:pointer;
    box-shadow:0 10px 22px -16px rgba(15,23,42,.9);
    transition:transform .2s, box-shadow .2s;
  }
  .back:hover { transform:translateX(-4px); }

  .banner {
    position:relative; overflow:hidden;
    display:flex; align-items:center; gap:20px;
    padding:26px 30px; border-radius:28px; color:#fff;
    background:linear-gradient(135deg,var(--c1),var(--c2));
    box-shadow:0 26px 44px -26px rgba(15,23,42,.8);
    margin-bottom:22px; text-shadow:0 2px 8px rgba(0,0,0,.2);
  }
  .banner::after {
    content:""; position:absolute; right:-50px; top:-60px;
    width:200px; height:200px; border-radius:50%;
    background:rgba(255,255,255,.16);
  }
  .banner-emoji { font-size:54px; line-height:1; filter:drop-shadow(0 5px 10px rgba(0,0,0,.25)); }
  .banner-name { font-size:clamp(24px,3.4vw,32px); font-weight:800; letter-spacing:-.02em; }
  .banner-sub { font-size:15px; font-weight:600; opacity:.92; margin-top:2px; }
  .banner-count {
    margin-left:auto; position:relative; z-index:1; flex:none;
    font-size:14px; font-weight:700; padding:9px 18px; border-radius:999px;
    background:rgba(255,255,255,.25); backdrop-filter:blur(6px);
  }

  .tabs {
    display:inline-flex; flex-wrap:wrap; gap:6px; padding:6px;
    margin-bottom:20px; background:#fff; border-radius:18px;
    box-shadow:0 12px 26px -20px rgba(15,23,42,.9);
  }
  .tab {
    font-family:inherit; font-size:15px; font-weight:700; color:var(--muted);
    background:transparent; border:none; border-radius:13px;
    padding:10px 22px; cursor:pointer; transition:color .2s, background .2s;
  }
  .tab:hover { color:var(--text); }
  .tab.active {
    color:#fff; background:linear-gradient(145deg,var(--c1),var(--c2));
    box-shadow:0 8px 18px -10px rgba(15,23,42,.8);
  }

  .panel {
    background:#fff; border-radius:26px; padding:26px;
    box-shadow:0 26px 50px -36px rgba(15,23,42,.9);
  }

  .add-form { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
  .add-form input {
    flex:1 1 220px; font-family:inherit; font-size:15px;
    padding:14px 18px; border:2px solid var(--line); border-radius:14px;
    outline:none; background:#fff; transition:border-color .2s, box-shadow .2s;
  }
  .add-form input:focus { border-color:#9db2c9; box-shadow:0 0 0 4px rgba(148,163,184,.16); }
  .add-form button {
    font-family:inherit; font-size:15px; font-weight:700; color:#fff;
    border:none; border-radius:14px; padding:14px 26px; cursor:pointer;
    background:linear-gradient(145deg,var(--c1),var(--c2));
    box-shadow:0 12px 22px -14px rgba(15,23,42,.95);
    transition:transform .2s, filter .2s;
  }
  .add-form button:hover { transform:translateY(-2px); filter:brightness(1.06); }

  .kids { display:flex; flex-direction:column; gap:10px; }
  .kid {
    display:flex; align-items:center; gap:14px; padding:10px 14px;
    border:1px solid var(--line); border-radius:16px; background:#f9fbfd;
    animation:pop .25s ease;
  }
  @keyframes pop { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .avatar {
    flex:none; width:44px; height:44px; display:grid; place-items:center;
    border-radius:50%; color:#fff; font-size:15px; font-weight:800;
    background:linear-gradient(145deg,var(--c1),var(--c2));
    box-shadow:0 8px 16px -10px rgba(15,23,42,.95);
  }
  .kid-name { flex:1; font-weight:600; }
  .del {
    flex:none; width:34px; height:34px; display:grid; place-items:center;
    font-size:14px; font-weight:700; color:#dc2626; background:#fee2e2;
    border:none; border-radius:10px; cursor:pointer; transition:background .2s;
  }
  .del:hover { background:#fecaca; }

  .empty { color:var(--muted); text-align:center; padding:26px 10px; font-weight:500; }

  /* ========== ЗАНЯТИЯ ========== */
  .sched { display:grid; gap:14px; }
  .sched-day {
    padding:16px 20px; border-radius:18px;
    background:#f9fbfd; border:1px solid var(--line);
  }
  .sched-day h4 {
    font-size:12.5px; font-weight:800; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted); margin-bottom:12px;
  }
  .sched-day ul { list-style:none; display:flex; flex-direction:column; gap:9px; }
  .sched-day li { display:flex; align-items:center; gap:11px; font-weight:600; }
  .sched-day li::before {
    content:""; flex:none; width:9px; height:9px; border-radius:50%;
    background:linear-gradient(145deg,var(--c1),var(--c2));
  }

  /* Редактирование занятий */
  .sched-day.editing {
    background:#fff;
    border:2px dashed var(--line);
  }
  .sched-items { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .sched-item { display:flex; gap:8px; align-items:center; animation:pop .2s ease; }
  .sched-item input {
    flex:1; font-family:inherit; font-size:14.5px; font-weight:600;
    color:var(--text); background:#fff;
    border:2px solid var(--line);
    border-radius:11px; padding:10px 12px; outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .sched-item input:focus {
    border-color:#9db2c9;
    box-shadow:0 0 0 3px rgba(148,163,184,.16);
  }
  .del-item {
    flex:none; width:34px; height:34px;
    display:grid; place-items:center;
    font-size:13px; font-weight:700;
    color:#dc2626; background:#fee2e2;
    border:none; border-radius:10px; cursor:pointer;
    transition:background .2s;
  }
  .del-item:hover { background:#fecaca; }
  .add-item {
    font-family:inherit; font-size:13.5px; font-weight:700;
    color:#2563eb; background:#eff6ff;
    border:none; border-radius:10px;
    padding:9px 16px; cursor:pointer;
    transition:background .2s, transform .15s;
  }
  .add-item:hover { background:#dbeafe; transform:translateY(-1px); }

  .mode-badge {
    display:inline-flex; align-items:center; gap:6px;
    font-size:13px; font-weight:700;
    color:#065f46; background:#ecfdf5;
    padding:7px 14px; border-radius:999px;
    margin-bottom:16px;
  }

  /* ========== ЗАМЕТКИ ========== */
  .notes {
    width:100%; min-height:320px; padding:18px;
    font-family:inherit; font-size:15px; line-height:1.65; color:var(--text);
    border:2px solid var(--line); border-radius:18px; background:#fcfdff;
    outline:none; resize:vertical; transition:border-color .2s, box-shadow .2s;
  }
  .notes:focus { border-color:#9db2c9; box-shadow:0 0 0 4px rgba(148,163,184,.16); }
  .notes[readonly] { background:#f1f5f9; cursor:default; }
  .hint { margin-top:10px; font-size:13.5px; font-weight:600; color:var(--muted); }

  /* ========== АДМИНКА ========== */
  .section-title { font-size:18px; font-weight:800; letter-spacing:-.01em; margin:28px 0 14px; }

  .admin-grid {
    display:grid; gap:18px;
    grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
  }
  .admin-card {
    background:#fff; border-radius:22px; padding:22px;
    border-top:5px solid var(--c1);
    box-shadow:0 24px 44px -34px rgba(15,23,42,.9);
    animation:pop .25s ease;
  }
  .admin-card-head {
    display:flex; align-items:center; gap:12px;
    margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--line);
  }
  .admin-emoji { font-size:30px; line-height:1; }
  .admin-name { flex:1; font-size:19px; font-weight:800; letter-spacing:-.01em; }

  .icon-btn {
    flex:none; width:36px; height:36px; display:grid; place-items:center;
    font-size:15px; border:none; border-radius:11px; cursor:pointer;
    background:#f1f5f9; color:var(--text); transition:background .2s;
  }
  .icon-btn:hover { background:#e2e8f0; }
  .icon-btn.danger { color:#dc2626; background:#fee2e2; }
  .icon-btn.danger:hover { background:#fecaca; }

  .admin-fields {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px; margin-bottom:18px;
  }
  .field { display:flex; flex-direction:column; gap:5px; min-width:0; }
  .field.wide { grid-column:1/-1; }
  .field label {
    font-size:11px; font-weight:800; color:var(--muted);
    letter-spacing:.07em; text-transform:uppercase;
  }
  .field input, .field textarea {
    width:100%; font-family:inherit; font-size:14.5px; font-weight:600;
    color:var(--text); background:#f9fbfd; border:2px solid var(--line);
    border-radius:11px; padding:10px 12px; outline:none;
    transition:border-color .2s, box-shadow .2s, background .2s;
  }
  .field textarea { resize:vertical; min-height:90px; line-height:1.55; }
  .field input:focus, .field textarea:focus {
    background:#fff; border-color:#9db2c9;
    box-shadow:0 0 0 3px rgba(148,163,184,.16);
  }
  .field input[type="color"] { padding:3px; height:42px; cursor:pointer; }
  .field input[type="number"] { font-variant-numeric:tabular-nums; }

  .admin-actions { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .btn {
    font-family:inherit; font-size:14.5px; font-weight:700;
    border:none; border-radius:13px; padding:12px 22px; cursor:pointer;
    transition:transform .15s, filter .15s, background .2s;
  }
  .btn.primary {
    color:#fff; background:linear-gradient(145deg,var(--c1),var(--c2));
    box-shadow:0 12px 22px -14px rgba(15,23,42,.95);
  }
  .btn.primary:hover { transform:translateY(-2px); filter:brightness(1.06); }
  .btn.ghost { color:var(--text); background:#f1f5f9; }
  .btn.ghost:hover { background:#e2e8f0; }
  .save-info { font-size:13px; font-weight:700; color:#0D9488; }

  .add-section {
    background:#fff; border-radius:22px; padding:22px;
    border-top:5px solid #94A3B8;
    box-shadow:0 24px 44px -34px rgba(15,23,42,.9);
    margin-bottom:8px;
  }
  .add-section h2 { font-size:17px; font-weight:800; margin-bottom:16px; letter-spacing:-.01em; }

  .admin-nav {
    display:flex; gap:8px; flex-wrap:wrap; padding:8px;
    background:#fff; border-radius:18px;
    box-shadow:0 12px 26px -20px rgba(15,23,42,.9);
    margin-bottom:24px;
  }
  .admin-nav a {
    display:inline-flex; align-items:center; gap:6px;
    font-size:14.5px; font-weight:700; text-decoration:none;
    color:var(--muted); padding:11px 20px; border-radius:13px;
    transition:color .2s, background .2s;
  }
  .admin-nav a:hover { color:var(--text); background:#f1f5f9; }
  .admin-nav a.active {
    color:#fff; background:linear-gradient(145deg,#60A5FA,#2563EB);
    box-shadow:0 10px 20px -12px rgba(37,99,235,.95);
  }

  .edit-home-card {
    background:#fff; border-radius:26px; padding:30px;
    box-shadow:0 26px 50px -36px rgba(15,23,42,.9);
    border-top:5px solid #60A5FA; animation:pop .25s ease;
  }
  .edit-home-card h2 { font-size:19px; font-weight:800; letter-spacing:-.01em; margin-bottom:6px; }
  .edit-home-card p.desc {
    color:var(--muted); font-size:14.5px; font-weight:500;
    margin-bottom:24px; line-height:1.55;
  }
  .edit-fields {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:18px; margin-bottom:24px;
  }
  .edit-fields .field.wide { grid-column:1/-1; }

  .preview-box {
    margin-top:30px; padding:26px; border-radius:22px;
    background:#f9fbfd; border:2px dashed var(--line);
  }
  .preview-label {
    font-size:11px; font-weight:800; color:var(--muted);
    letter-spacing:.1em; text-transform:uppercase;
    margin-bottom:18px; text-align:center;
  }
  .preview-hero h1 {
    font-size:clamp(24px,3.6vw,38px); letter-spacing:-.025em;
    line-height:1.1; text-align:center; white-space:pre-line;
  }
  .preview-hero p {
    color:var(--muted); margin-top:10px; font-size:16px; font-weight:500;
    text-align:center; white-space:pre-line;
  }
  .preview-welcome {
    text-align:center; color:var(--muted); font-size:15px;
    font-weight:500; margin-top:14px; white-space:pre-line; line-height:1.6;
  }

  .login-wrap { max-width:420px; margin:60px auto; }
  .login-box {
    background:#fff; border-radius:28px; padding:36px 32px;
    box-shadow:0 30px 60px -30px rgba(15,23,42,.35);
    animation:pop .3s ease;
  }
  .login-icon {
    width:72px; height:72px; margin:0 auto 20px; display:grid; place-items:center;
    font-size:36px; border-radius:50%;
    background:linear-gradient(145deg,#60A5FA,#2563EB);
    box-shadow:0 18px 30px -18px rgba(37,99,235,.9);
  }
  .login-box h2 {
    font-size:24px; font-weight:800; text-align:center;
    letter-spacing:-.02em; margin-bottom:6px;
  }
  .login-box p.sub {
    text-align:center; color:var(--muted); font-size:15px;
    font-weight:500; margin-bottom:26px;
  }
  .login-form { display:flex; flex-direction:column; gap:14px; }
  .login-form input {
    font-family:inherit; font-size:15px; padding:14px 18px;
    border:2px solid var(--line); border-radius:14px; outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .login-form input:focus {
    border-color:#9db2c9; box-shadow:0 0 0 4px rgba(148,163,184,.16);
  }
  .login-form button {
    font-family:inherit; font-size:15.5px; font-weight:800; color:#fff;
    border:none; border-radius:14px; padding:15px; cursor:pointer;
    background:linear-gradient(145deg,#60A5FA,#2563EB);
    box-shadow:0 14px 24px -14px rgba(37,99,235,.95);
    transition:transform .2s, filter .2s; margin-top:4px;
  }
  .login-form button:hover { transform:translateY(-2px); filter:brightness(1.06); }
  .login-form button:disabled { opacity:.6; cursor:wait; }
  .login-error {
    color:#dc2626; font-size:14px; font-weight:700;
    text-align:center; min-height:20px; margin-top:2px;
  }

  .loading { text-align:center; padding:80px 20px; color:var(--muted); font-size:16px; font-weight:600; }
  .error-box {
    max-width:520px; margin:60px auto; background:#fff; border-radius:24px;
    padding:32px; text-align:center;
    box-shadow:0 30px 60px -30px rgba(15,23,42,.35);
    border-top:5px solid #dc2626;
  }
  .error-box h2 { font-size:22px; font-weight:800; margin-bottom:12px; }
  .error-box p { color:var(--muted); line-height:1.6; margin-bottom:8px; }

  .toast {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#1f2937; color:#fff; padding:14px 24px; border-radius:14px;
    font-size:14.5px; font-weight:700;
    box-shadow:0 20px 40px -20px rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
    z-index:1000;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:560px) {
    body { padding:18px 14px 50px; }
    .grid { grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }
    .card { border-radius:24px; padding:14px; }
    .card-emoji { font-size:42px; }
    .card-name { font-size:20px; margin-top:6px; }
    .card-sub { font-size:10.5px; }
    .card-count { bottom:12px; font-size:12px; padding:4px 10px; }
    .banner { padding:20px; gap:14px; border-radius:22px; }
    .banner-emoji { font-size:40px; }
    .banner-count { display:none; }
    .panel { padding:18px; border-radius:22px; }
    .admin-grid { grid-template-columns:1fr; }
    .admin-card { padding:18px; }
    .login-box { padding:28px 22px; }
    .edit-home-card { padding:22px 18px; }
    .edit-fields { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div id="app"><div class="loading">Загрузка…</div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ГЛОБАЛЬНОЕ СОСТОЯНИЕ
   ============================================================ */
let state = { settings: {}, groups: [] };
let authToken = sessionStorage.getItem('vospitatel_token') || null;

const TOKEN_KEY = 'vospitatel_token';
const app = document.getElementById('app');
const toastEl = document.getElementById('toast');

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => (
  { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]
));

function plural(n, forms) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return forms[2];
  if (b > 1 && b < 5) return forms[1];
  if (b === 1) return forms[0];
  return forms[2];
}

function initials(name) {
  return String(name).trim().split(/\s+/).slice(0,2)
    .map(w => w.charAt(0)).join('').toUpperCase();
}

const countKids = n => n + ' ' + plural(n, ['ребёнок','ребёнка','детей']);
const uid = () => 'g' + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), 2500);
}

function isAdmin() { return !!authToken; }

/* ============================================================
   API КЛИЕНТ
   ============================================================ */
async function apiLogin(password) {
  const r = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password })
  });
  if (!r.ok) return null;
  const data = await r.json();
  return data.token;
}

async function apiLogout() {
  if (!authToken) return;
  try {
    await fetch('/api/logout', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + authToken }
    });
  } catch (e) {}
}

async function apiLoadState() {
  const r = await fetch('/api/state');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}

let saveTimer = null;
let saveInFlight = false;
let saveQueued = false;

async function apiSaveState() {
  if (!authToken) return;
  if (saveInFlight) { saveQueued = true; return; }
  saveInFlight = true;
  try {
    const r = await fetch('/api/state', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + authToken
      },
      body: JSON.stringify(state)
    });
    if (r.status === 401) {
      authToken = null;
      sessionStorage.removeItem(TOKEN_KEY);
      toast('Сессия истекла, войдите заново');
      location.hash = '#/login';
    }
  } catch (e) {
    console.error('Ошибка сохранения:', e);
  } finally {
    saveInFlight = false;
    if (saveQueued) { saveQueued = false; apiSaveState(); }
  }
}

function save() {
  if (!authToken) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(apiSaveState, 400);
}

function renderPanel(g, tab, admin) {
  const panel = document.getElementById('panel');
  if (!panel) return;

  /* --- ДЕТИ --- */
  if (tab === 'children') {
    panel.innerHTML = `
      ${admin ? `
        <form class="add-form" id="addForm">
          <input id="kidInput" placeholder="Имя и фамилия ребёнка"
                 autocomplete="off" maxlength="60">
          <button type="submit">+ Добавить</button>
        </form>` : `
        <div class="hint" style="margin-bottom:16px">
          👁 Режим просмотра. Редактирование доступно только администрации.
        </div>`}

      <div class="kids">
        ${g.children.length
          ? g.children.map((c, i) => `
              <div class="kid">
                <div class="avatar">${esc(initials(c))}</div>
                <div class="kid-name">${esc(c)}</div>
                ${admin ? `<button class="del" data-i="${i}" title="Удалить">✕</button>` : ''}
              </div>`).join('')
          : `<div class="empty">Список пуст${admin ? '. Добавьте первого ребёнка 👶' : ''}</div>`}
      </div>
    `;

    const form = panel.querySelector('#addForm');
    if (form) {
      const input = panel.querySelector('#kidInput');
      form.addEventListener('submit', e => {
        e.preventDefault();
        const v = input.value.trim();
        if (!v) return;
        g.children.push(v);
        save();
        renderGroup(g.id, 'children');
        const ni = document.getElementById('kidInput');
        if (ni) ni.focus();
      });
    }

    panel.querySelectorAll('.del').forEach(btn => {
      btn.onclick = () => {
        g.children.splice(Number(btn.dataset.i), 1);
        save();
        renderGroup(g.id, 'children');
      };
    });
    return;
  }

  /* --- ЗАНЯТИЯ --- */
  if (tab === 'schedule') {

    /* Режим просмотра для обычных пользователей */
    if (!admin) {
      panel.innerHTML = `
        <div class="hint" style="margin-bottom:16px">
          👁 Режим просмотра. Редактирование доступно только администрации.
        </div>
        <div class="sched">
          ${g.schedule.map(d => `
            <div class="sched-day">
              <h4>${esc(d.day)}</h4>
              <ul>${(d.items || []).map(it => `<li>${esc(it)}</li>`).join('')}</ul>
            </div>
          `).join('')}
        </div>
      `;
      return;
    }

    /* Режим редактирования для администратора */
    panel.innerHTML = `
      <div class="mode-badge">✏️ Режим редактирования — изменения сохраняются автоматически</div>

      <div class="sched" id="schedEdit">
        ${g.schedule.map((d, di) => `
          <div class="sched-day editing" data-day="${di}">
            <h4>${esc(d.day)}</h4>
            <div class="sched-items" data-di="${di}">
              ${(d.items || []).map((it, ii) => `
                <div class="sched-item">
                  <input type="text" data-di="${di}" data-ii="${ii}"
                         value="${esc(it)}" maxlength="60"
                         placeholder="Название занятия">
                  <button class="del-item" data-di="${di}" data-ii="${ii}"
                          title="Удалить занятие">✕</button>
                </div>
              `).join('')}
            </div>
            <button class="add-item" data-di="${di}">+ Добавить занятие</button>
          </div>
        `).join('')}
      </div>
    `;

    /* Изменение текста занятия */
    panel.querySelectorAll('.sched-item input').forEach(inp => {
      inp.addEventListener('input', () => {
        const di = Number(inp.dataset.di);
        const ii = Number(inp.dataset.ii);
        g.schedule[di].items[ii] = inp.value;
        save();
      });
    });

    /* Удаление занятия */
    panel.querySelectorAll('.del-item').forEach(btn => {
      btn.onclick = () => {
        const di = Number(btn.dataset.di);
        const ii = Number(btn.dataset.ii);
        g.schedule[di].items.splice(ii, 1);
        save();
        renderGroup(g.id, 'schedule');
      };
    });

    /* Добавление занятия */
    panel.querySelectorAll('.add-item').forEach(btn => {
      btn.onclick = () => {
        const di = Number(btn.dataset.di);
        g.schedule[di].items.push('');
        save();
        renderGroup(g.id, 'schedule');
        /* Фокус в новое поле */
        requestAnimationFrame(() => {
          const dayBlock = panel.querySelector(`.sched-day[data-day="${di}"]`);
          if (dayBlock) {
            const inputs = dayBlock.querySelectorAll('.sched-item input');
            const last = inputs[inputs.length - 1];
            if (last) last.focus();
          }
        });
      };
    });

    return;
  }

  /* --- ЗАМЕТКИ --- */
  panel.innerHTML = `
    <textarea class="notes" id="notes" ${admin ? '' : 'readonly'}
      placeholder="${admin ? 'Наблюдения, планы, родительские вопросы…' : 'Заметки доступны только администрации'}">${esc(g.notes || '')}</textarea>
    <div class="hint" id="hint">
      ${admin ? 'Изменения сохраняются на сервере автоматически' : '👁 Режим просмотра'}
    </div>
  `;

  if (!admin) return;

  const ta   = panel.querySelector('#notes');
  const hint = panel.querySelector('#hint');
  let timer;

  ta.addEventListener('input', () => {
    g.notes = ta.value;
    clearTimeout(timer);
    timer = setTimeout(() => {
      save();
      hint.textContent = 'Сохранено на сервере ✓';
      hint.style.color = '#0D9488';
      setTimeout(() => {
        hint.textContent = 'Изменения сохраняются на сервере автоматически';
        hint.style.color = '';
      }, 1600);
    }, 500);
  });
}

function setChildrenCount(group, n) {
  n = Math.max(0, Math.min(99, parseInt(n) || 0));
  while (group.children.length < n) {
    group.children.push('Ребёнок ' + (group.children.length + 1));
  }
  while (group.children.length > n) {
    group.children.pop();
  }
}

        <div class="field">
          <label>Цвет 1</label>
          <input data-f="c1" type="color" value="${esc(g.c1)}">
        </div>
        <div class="field">
          <label>Цвет 2</label>
          <input data-f="c2" type="color" value="${esc(g.c2)}">
        </div>
      </div>

      <div class="admin-actions">
        <button class="btn primary" data-act="save">Сохранить</button>
        <a class="btn ghost" href="#/group/${encodeURIComponent(g.id)}/schedule"
           style="text-decoration:none;display:inline-flex;align-items:center">
           ✏️ Редактировать занятия
        </a>
        <span class="save-info" data-role="info"></span>
      </div>
    </div>
  `).join('');

  grid.querySelectorAll('.admin-card').forEach(card => {

      const g = state.groups.find(x => x.id === id);

      const get = f => card.querySelector(`[data-f="${f}"]`).value;

      g.emoji    = String(get('emoji')).trim() || '📁';
      g.name     = String(get('name')).trim() || 'Без названия';
      g.subtitle = String(get('subtitle')).trim() || 'Группа';

      save();

      card.querySelector('.admin-emoji').textContent = g.emoji;
      card.querySelector('.admin-name').textContent  = g.name;

      card.querySelector('[data-f="count"]').value = g.children.length;

      setTimeout(() => { info.textContent = ''; }, 1800);

      renderAdminGroups();
      toast('Группа удалена');

    card.querySelector('[data-f="emoji"]').addEventListener('input', e => {
      card.querySelector('.admin-emoji').textContent = e.target.value || '📁';

    card.querySelector('[data-f="name"]').addEventListener('input', e => {

  };

  app.innerHTML = `
    <div class="wrap">
      ${adminTopbar()}
      <button class="back" id="back">← На главную</button>

      <header class="hero">
        <h1>Редактирование главной</h1>
        <p>Настройте тексты и заголовки первой страницы сайта</p>
      </header>

      ${adminNav('home')}

      <section class="edit-home-card">
        <h2>🏠 Содержимое главной страницы</h2>
        <p class="desc">Изменения сохраняются в базе данных и видны всем посетителям.</p>

        <form id="editHomeForm">
          <div class="edit-fields">
            <div class="field wide">
              <label>Заголовок сайта (h1)</label>
              <input name="pageTitle" maxlength="80"
                     value="${esc(s.pageTitle || '')}">
            </div>
            <div class="field wide">
              <label>Подзаголовок</label>
              <input name="pageSubtitle" maxlength="140"
                     value="${esc(s.pageSubtitle || '')}">
            </div>
            <div class="field wide">
              <label>Название вкладки браузера</label>
              <input name="browserTitle" maxlength="80"
                     value="${esc(s.browserTitle || '')}">
            </div>
            <div class="field wide">
              <label>Приветственный текст</label>
              <textarea name="welcomeText" maxlength="400"
              >${esc(s.welcomeText || '')}</textarea>
            </div>
          </div>

          <div class="admin-actions">
            <button type="submit" class="btn primary" style="--c1:#60A5FA;--c2:#2563EB">
              Сохранить изменения
            </button>
            <button type="button" class="btn ghost" id="resetBtn">
              Сбросить к значениям по умолчанию
            </button>
            <span class="save-info" id="saveInfo"></span>
          </div>
        </form>

        <div class="preview-box">
          <div class="preview-label">👁 Живое превью главной страницы</div>
          <div class="preview-hero">
            <h1 id="pvTitle">${esc(s.pageTitle || '')}</h1>
            <p id="pvSubtitle">${esc(s.pageSubtitle || '')}</p>
            <div class="preview-welcome" id="pvWelcome">${esc(s.welcomeText || '')}</div>
          </div>
        </div>
      </section>
    </div>
  `;

  document.getElementById('back').onclick = () => { location.hash = '#/'; };
  bindLogout();

  const form   = document.getElementById('editHomeForm');
  const info   = document.getElementById('saveInfo');
  const pvT    = document.getElementById('pvTitle');
  const pvS    = document.getElementById('pvSubtitle');
  const pvW    = document.getElementById('pvWelcome');
  const inputs = form.elements;

  const updatePreview = () => {
    pvT.textContent = inputs.pageTitle.value || 'Кабинет воспитателя';
    pvS.textContent = inputs.pageSubtitle.value || '';
    pvW.textContent = inputs.welcomeText.value || '';
  };
  ['pageTitle', 'pageSubtitle', 'welcomeText'].forEach(n => {
    inputs[n].addEventListener('input', updatePreview);
  });

  form.addEventListener('submit', e => {
    e.preventDefault();
    state.settings = {
      pageTitle:    inputs.pageTitle.value.trim() || 'Кабинет воспитателя',
      pageSubtitle: inputs.pageSubtitle.value.trim(),
      browserTitle: inputs.browserTitle.value.trim() || 'Кабинет воспитателя',
      welcomeText:  inputs.welcomeText.value.trim()
    };
    save();
    document.title = 'Админ-панель — Главная страница';
    info.textContent = 'Сохранено ✓';
    setTimeout(() => { info.textContent = ''; }, 2000);
    toast('Сохранено в базе данных');
  });

  document.getElementById('resetBtn').onclick = () => {
    if (!confirm('Сбросить тексты к значениям по умолчанию?')) return;
    state.settings = { ...ПО_УМОЛЧАНИЮ };
    save();
    renderAdminHome();
  };
}

/* ============================================================
   ЭКРАНЫ ОШИБОК
   ============================================================ */
function renderError(msg) {
  app.innerHTML = `
    <div class="error-box">
      <h2>⚠️ Не удалось загрузить данные</h2>
      <p>${esc(msg)}</p>
      <p style="margin-top:18px">
        Убедитесь, что сервер запущен:
        <code style="background:#f1f5f9;padding:2px 8px;border-radius:6px">npm start</code>
      </p>
      <button class="btn primary" onclick="location.reload()"
              style="--c1:#60A5FA;--c2:#2563EB;margin-top:20px">
        Попробовать снова
      </button>
    </div>
  `;
}

/* ============================================================
   РОУТЕР
   ============================================================ */
function router() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);

  if (parts[0] === 'login') {
    if (isAdmin()) { location.hash = '#/admin'; return; }
    renderLogin();
  } else if (parts[0] === 'admin') {
    if (!isAdmin()) { location.hash = '#/login'; return; }
    if (parts[1] === 'home') renderAdminHome();
    else renderAdminGroups();
  } else if (parts[0] === 'group' && parts[1]) {
    renderGroup(decodeURIComponent(parts[1]), parts[2] || 'children');
  } else {
    renderHome();
  }
  window.scrollTo({ top: 0 });
}

/* ============================================================
   ЗАПУСК
   ============================================================ */
async function boot() {
  try {
    state = await apiLoadState();
    if (!state.settings) state.settings = {};
    if (!Array.isArray(state.groups)) state.groups = [];
    router();
  } catch (e) {
    renderError('Сервер не отвечает: ' + e.message);
  }
}

window.addEventListener('hashchange', router);
boot();
</script>
</body>
</html>
